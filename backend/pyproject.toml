[project]
name = "fpa-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "sqlalchemy>=2", "asyncpg", "pydantic>=2", "pydantic-settings", "oracledb", "psycopg[binary]", "argon2-cffi"]
[project.optional-dependencies]
odbc = ["pyodbc"]
dev = ["pytest", "httpx"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
